  useEffect(()=>{if(!key)return;try{localStorage.setItem(key,JSON.stringify(S))}catch(e){}},[S,key]);
  useEffect(()=>{if(user)setEmailOk(!!user.email_consent)},[user]);
  useEffect(()=>{if(!user)return;api("adaptive",{user_id:user.user_id,consent,twin:S.twin,elo:S.elo}).then(r=>{if(r&&r.ok)setS(s=>({...s,elo:r.elo,plan:r.plan,twin:Object.keys(r.twin||{}).length?{...(s.twin||{}),...r.twin}:s.twin}))})},[user,consent]);
  if(!user)return<Login onLogin={u=>setUser(u)}/>;
  const name=(user.name.split(" ")[0]||"Player"),last=S.history.at(-1),prof=profileOf(last),xp=S.xp;
  const play=(game,score,o,x={})=>{const gain=Math.max(10,Math.trunc(score)),up=levelOf(S.xp+gain)>levelOf(S.xp);setToast(`+${gain} XP`+(up?` · Level ${levelOf(S.xp+gain)} 🎉`:""));setTimeout(()=>setToast(null),3200);api("score",{user_id:user.user_id,name:user.name,consent,game,score,response_time:x.t,hesitations:x.h,correct_count:x.correct_count,total_count:x.total_count,prev_twin:S.twin,prev_elo:S.elo}).then(r=>{setS(s=>applyTwin(s,game,score,r&&r.twin,r&&r.adaptive));const ar=r&&r.adaptive&&r.adaptive.result;if(ar&&ar.action!=="stable"){setToast("Level "+ar.old_level+" → "+ar.new_level+(ar.action==="augmentation"?" 📈":" 📉"));setTimeout(()=>setToast(null),3200)}if(r&&r.engagement){setEng(r.engagement);setMoodSent(false)}})};
  const start=g=>{if(consent)api("start",{user_id:user.user_id,name:user.name,consent,game:g})};
  const sendMood=m=>{setMoodSent(true);api("mood",{user_id:user.user_id,mood:m})};
  const fixState=(agrees,st)=>{api("engagement/feedback",{user_id:user.user_id,agrees,corrected_state:st})};
  const ask=p=>{setPending(p);setPage("coach")};
  const goals={...DEFAULT_GOALS,...(S.goals||{})},objective={...DEFAULT_OBJECTIVE,...(S.objective||{})};
  const changeGoal=(key,value)=>{const target=Math.max(1,Math.min(100,Number(value)||80));setS(s=>({...s,goals:{...DEFAULT_GOALS,...(s.goals||{}),[key]:target}}))};
  const changeObjective=(key,value)=>setS(s=>({...s,objective:{...DEFAULT_OBJECTIVE,...(s.objective||{}),[key]:key==="weekly_sessions"?Math.max(1,Math.min(7,Number(value)||3)):value}}));
  const deleteAccount=async()=>{if(!user.email)return;if(!window.confirm("Delete your account and all saved scores, plans, and activity? This cannot be undone."))return;const password=window.prompt("Enter your password to confirm account deletion:");if(password===null)return;const r=await api("delete-account",{email:user.email,password});if(r&&r.ok){try{if(key)localStorage.removeItem(key)}catch(e){}setUser(null);setS(INIT);setPage("hub");setConsent(false);setEmailOk(false);window.alert("Your account and saved data have been deleted.")}else window.alert(r&&r.error?r.error:"Could not reach the server. Please try again.")};
  const ks=Object.keys(prof),weak=weakOf(prof,last),strong=strongOf(prof,last),bs=badges(S),got=bs.filter(b=>b[3]>=b[4]).length;
  const board=[...DEMO.map(([n,x])=>[n,x,false]),[name,xp,true]].sort((a,b)=>b[1]-a[1]);
  const PAGES=[["hub","✨ Brain Hub"],["arcade","🎮 Arcade"],["twin","📊 Brain Twin"],["ach","🏆 Achievements"],["coach","💬 AI Coach"],["journey","🧭 My Journey"]];
  const Badge=({b})=>{const[n,i,d,c,g,sh]=b,done=c>=g;return<div className={"card badge"+(done?" done":"")}><div className={"bi "+sh+(done?"":" lock")}>{i}</div><b>{n}</b><div className="sm" style={{margin:"4px 0"}}>{d}</div><div className="bar"><div style={{width:pyRound(c/g*100)+"%"}}/></div><div className="sm" style={{marginTop:6}}>{done?"Unlocked ✅":`${c}/${g}`}</div></div>};
  const csv=()=>{const rows=["date,Memory,Attention,Logic,Speed,Overall",...S.history.map(r=>[r.date,r.Memory,r.Attention,r.Logic,r.Speed,r.Overall].join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows],{type:"text/csv"}));a.download="axona_progress.csv";a.click()};
  return<div className="app"><aside><div className="brand"><img className="logo" src={LOGO} alt="Axona"/><div className="bn">Axona</div></div>
    {PAGES.map(([k,l])=><button key={k} className={"nav"+(page===k?" on":"")} onClick={()=>setPage(k)}>{l}</button>)}
    <div style={{flex:1}}/><label style={{display:"flex",gap:8,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={consent} onChange={e=>{const c=e.target.checked;setConsent(c);if(!c&&emailOk){setEmailOk(false);api("email-consent",{user_id:user.user_id,email:user.email,name:user.name,consent:false})}}}/>I agree to have my scores saved</label><label style={{display:"flex",gap:8,alignItems:"center",cursor:consent?"pointer":"not-allowed",opacity:consent?1:.5,marginTop:6}}><input type="checkbox" disabled={!consent||!user.email} checked={emailOk} onChange={e=>{setEmailOk(e.target.checked);api("email-consent",{user_id:user.user_id,email:user.email,name:user.name,consent:e.target.checked})}}/>Send me a friendly reminder e-mail if I'm away</label>
    <div style={{display:"flex",gap:12,alignItems:"center",marginTop:10}}><div className="logo" style={{borderRadius:"50%"}}>{name[0].toUpperCase()}</div><div><b>{name}</b><br/><span className="sm">Level {levelOf(xp)} · {xp} XP</span></div></div>
    <div className="bar"><div style={{width:(xp%250)/250*100+"%"}}/></div><div className="sm">{250-xp%250} XP to the next level</div>
    <button className="btn" onClick={()=>{setUser(null);setS(INIT);setPage("hub")}}>Log out</button></aside>
  <main>
  {eng&&consent&&<CheckIn key={eng.session_id} eng={eng} moodSent={moodSent} onMood={sendMood} onFix={fixState} onClose={()=>setEng(null)}/>}
  {page==="hub"&&<><div className="hero"><div className="ht">Hi {name} 👋<br/>Ready to grow your brain today?</div><div className="sub">Play a game, earn XP, and see your progress below.</div></div>
    <div className="g g4"><Metric i="🏅" l="Level" v={levelOf(xp)} f="Keep collecting XP"/><Metric i="✨" l="Experience" v={xp+" XP"} f="Every round counts"/><Metric i="🎯" l="Games played" v={S.completed.length} f="One step at a time"/><Metric i="📈" l="Growth score" v={last.Overall+"%"} f="Your latest result"/></div>
    <div className="g" style={{gridTemplateColumns:"3fr 1fr",margin:"16px 0",alignItems:"center"}}><div className="card"><h4>💡 Brino suggests: {GAME_FOR[weak]}</h4><div className="sub">{weak} is your lowest score right now. One quick round is the best way to raise it.</div></div><button className="btn p w" style={{height:"100%"}} onClick={()=>setPage("arcade")}>Play it now</button></div>
    <div className="g g2"><div className="card"><h4>Your growth over time</h4><Growth hist={S.history}/></div>
    <div className="card"><h4>Leaderboard</h4><div className="sm">Demo players, to compare yourself</div>{board.slice(0,6).map(([n,x,me],i)=><div className="lb" key={n}><span style={{width:20}} className="sm">{i+1}</span><span style={{width:70,overflow:"hidden",textOverflow:"ellipsis"}}>{me?<b>{n} (you)</b>:n}</span><div className="t"><div className={"f"+(me?" me":"")} style={{width:pyRound(x/board[0][1]*100)+"%"}}/></div><span>{x}</span></div>)}</div></div>
    <div className="g g3" style={{marginTop:16}}><div className="card"><h4>Achievements</h4><div className="sm">{got} of {bs.length} unlocked</div><div className="bar"><div style={{width:got/bs.length*100+"%"}}/></div></div>
      <div className="card"><h4>Team ranking</h4><div className="sm">Demo teams, share of weekly goal</div><div className="rings"><Ring pct={72} label="Neurons"/><Ring pct={58} label="Synapse" c1="#f5c451" c2="#ff9d5c"/></div></div>
      <div className="card"><h4>Skill progress</h4><div className="rings"><Ring pct={prof["Working Memory"]} label="Memory"/><Ring pct={prof.Attention} label="Focus" c1="#f5c451" c2="#ff9d5c"/><Ring pct={prof["Problem Solving"]} label="Logic" c1="#8bf0c8" c2="#4aa8ff"/><Ring pct={prof["Processing Speed"]} label="Speed" c1="#8bf0c8" c2="#4aa8ff"/></div></div></div>
    <p className="sm" style={{marginTop:18}}>Scores are playful practice indicators. They are not diagnoses or fixed labels.</p></>}
  {page==="arcade"&&<Arcade S={S} play={play} flash={flash} setFlash={setFlash} start={start}/>}
  {page==="twin"&&<><Head t="Brain Twin" s="A picture of your practice scores. It changes every time you play."/>
    <BrainGarden hist={S.history} profile={prof} twin={S.twin}/>
    <div className="g g4">{ks.map(k=><Metric key={k} i="🧠" l={k} v={prof[k]+"%"} f={uncOf(S,k)?uncOf(S,k)+" · estimate":"Not measured yet"}/>)}</div>
    <div className="card" style={{margin:"16px 0"}}><h4>In plain words</h4><div className="sub">Your best area right now is <b>{strong}</b> ({prof[strong]}%). The area with the most room to grow is <b>{weak}</b> ({prof[weak]}%).</div></div>
    <div className="g g2e"><div className="card"><h4>Skill map</h4><Radar prof={prof}/></div><div className="card"><h4>Overall growth</h4><Growth hist={S.history} h={300}/></div></div>
    <div className="card" style={{marginTop:16}}><h4>Progress by dimension</h4><div className="sm">Each line shows your recorded score after a practice session.</div><DimensionGrowth hist={S.history}/><div className="chart-legend">{DIM_SERIES.map(s=><span key={s.key} className="legend-item"><i className="legend-dot" style={{background:s.color,color:s.color}}/>{s.label}</span>)}</div></div>
    <div className="card" style={{marginTop:16}}><h4>Recent activity heatmap</h4><div className="sm" style={{marginBottom:12}}>Average recorded score by dimension and day. Empty cells mean no session was recorded.</div><DimensionHeatmap hist={S.history}/><div className="chart-legend"><span className="legend-item"><i className="legend-dot" style={{background:"#1c273f",color:"#1c273f"}}/>No session</span><span className="legend-item"><i style={{width:28,height:9,borderRadius:99,background:"linear-gradient(90deg,rgba(92,225,230,.12),rgba(92,225,230,.9))"}}/>Score low to high</span></div></div>
    <div className="card" style={{marginTop:16}}><h4>Score goals</h4><div className="sm" style={{marginBottom:12}}>Adjust a target for each dimension. Progress is measured from your first recorded score toward that target.</div><GoalTracker hist={S.history} goals={goals} onGoalChange={changeGoal}/></div>
    <button className="btn" style={{marginTop:16}} onClick={()=>ask("Explain my progress and what my scores mean")}>Ask Brino to explain my results</button>
    <div className="flash info" style={{marginTop:16}}>Uncertainty note: this prototype shows practice scores only. Scores are not definitive measures of ability.</div></>}
  {page==="ach"&&<><Head t="Achievements 🏆" s={`You unlocked ${got} of ${bs.length} badges. Grey badges show what to do next.`}/><div className="bar" style={{marginBottom:18}}><div style={{width:got/bs.length*100+"%"}}/></div>
    <div className="g g4">{bs.map(b=><Badge key={b[0]} b={b}/>)}</div>
    <div className="card" style={{marginTop:16}}><h4>Next badge to unlock</h4><div className="sub">{(t=>t.length?`${t[0][0]}: ${t[0][2].toLowerCase()}.`:"You unlocked everything. Impressive!")(bs.filter(b=>b[3]<b[4]).sort((a,b)=>b[3]/b[4]-a[3]/a[4]))}</div></div></>}
  {page==="coach"&&<Coach S={S} name={name} pending={pending} clear={()=>setPending(null)} go={setPage} user={user} consent={consent} objective={objective} onObjectiveChange={changeObjective}/>}
  {page==="journey"&&<><Head t="My journey 🪴" s="Your recent sessions, the XP you earned and your history in one place."/>
    <div className="g g3"><Metric i="🏅" l="Level" v={levelOf(xp)} f="Explorer rank"/><Metric i="✨" l="Total XP" v={xp} f="Experience earned"/><Metric i="🎯" l="Games completed" v={S.completed.length} f="Keep your streak alive"/></div>
    <h3 style={{margin:"22px 0 6px"}}>Session history</h3>
    <table><thead><tr><th>Session</th><th>Memory</th><th>Attention</th><th>Logic</th><th>Speed</th><th>Overall</th></tr></thead><tbody>{S.history.map((r,i)=><tr key={i}><td><b>{r.date}</b></td>{["Memory","Attention","Logic","Speed","Overall"].map(c=>{const d=i?r[c]-S.history[i-1][c]:0;return<td key={c}>{c==="Overall"?<b>{r[c]}%</b>:r[c]+"%"}{d!==0&&<span className={d>0?"up":"dn"}>{d>0?"▲":"▼"} {Math.abs(d)}</span>}</td>})}</tr>)}</tbody></table>
    <button className="btn" onClick={csv}>Download my progress (CSV)</button>
    <div className="card" style={{marginTop:16}}><h4>🗓️ Your weekly plan</h4><div className="sm">Computed from your Brain Twin scores and recent results. The gap has a 60% weight in priority, alongside dimension importance (25%) and recent difficulty (15%). When multiple skills have scores, the strongest one gets at least one maintenance session. It updates after every round.</div>
    {S.planNotice&&<div className="flash info" style={{marginTop:12}}>{S.planNotice}</div>}{S.plan&&S.plan.length?<table><thead><tr><th>Dimension / role</th><th>Activity</th><th>Elo</th><th>Current score</th><th>Target</th><th>Gap</th><th>Weekly practice</th><th>Why this activity</th></tr></thead><tbody>{S.plan.map(p=><tr key={p.dimension}><td><b>{p.name}</b><div className="sm">{p.role==="focus"?"Focus":p.role==="maintenance"?"Maintenance":"Baseline / practice"}</div></td><td>{p.game}</td><td>{S.elo&&S.elo[p.dimension]?S.elo[p.dimension].level+"/10":"-"}</td><td>{p.evaluated?Math.round(p.current_score)+"%":"Not measured ("+Math.round(p.current_score)+"% estimate)"}</td><td>{Math.round(p.target_score)}%</td><td>{Math.round(p.gap)} points</td><td>{p.sessions} sessions of {p.session_minutes} min</td><td>{p.note}</td></tr>)}</tbody></table>:<div className="sub" style={{marginTop:8}}>Play a game to generate your plan.</div>}</div>
    <div className="card" style={{marginTop:16}}><h4>Privacy and data controls</h4><div className="sub">Without score consent, game history stays in this browser. With consent, scores and adaptive learning data are stored on the server. Inactive account data is removed after 365 days. You can delete your account and saved data at any time.</div><button className="btn" style={{marginTop:10}} onClick={()=>setS(INIT)}>Reset this session's progress</button>{user.email&&<button className="btn" style={{marginTop:10,marginLeft:8,borderColor:"#ff879d",color:"#ffb0bf"}} onClick={deleteAccount}>Delete my account and all data</button>}</div></>}
  </main>{toast&&<div className="toast">{toast}</div>}</div>}
/* Fond animé : réseau de neurones */
(()=>{const cv=document.getElementById("bg"),x=cv.getContext("2d");let W,H,N=[];const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;N=Array.from({length:Math.min(70,Math.round(W*H/24000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))};rs();addEventListener("resize",rs);
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
(function f(){x.clearRect(0,0,W,H);N.forEach((a,i)=>{a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H;x.fillStyle="rgba(167,139,250,.7)";x.beginPath();x.arc(a.x,a.y,1.8,0,6.3);x.fill();for(let j=i+1;j<N.length;j++){const b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<150){x.strokeStyle=`rgba(92,225,230,${.18*(1-d/150)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}});requestAnimationFrame(f)})()})();
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
